[package]
name = "mail-parser-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
memchr = "2.8"
serde_json = "1.0"
encodify = { path = "../../encodify" }
mail-parser = { path = "..", features = ["serde"] }

[features]
default = ["full_encoding"]
full_encoding = ["mail-parser/full_encoding"]

[workspace]
members = ["."]

[lib]
path = "src/lib.rs"
test = false
doc = false
bench = false

[lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "limits"
path = "fuzz_targets/limits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fields"
path = "fuzz_targets/fields.rs"
test = false
doc = false
bench = false

[[bin]]
name = "charsets"
path = "fuzz_targets/charsets.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kernels"
path = "fuzz_targets/kernels.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mbox"
path = "fuzz_targets/mbox.rs"
test = false
doc = false
bench = false
